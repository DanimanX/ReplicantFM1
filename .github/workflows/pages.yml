name: pages

# Publishes the browser installer and the browser editor to GitHub Pages, so the firmware can be installed
# from https://danimanx.github.io/ReplicantFM1/ in Chrome or Edge over USB-MIDI: no toolchain, no Python, no
# terminal. web/make_site.py wraps the committed package in the same installer Felucca ships.
on:
  push:
    branches: [main]
    paths:
      - "ReplicantFM1-*.fwsc"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the package
        id: pkg
        run: |
          PKG=$(ls -1 ReplicantFM1-*.fwsc | tail -1)
          VER=${PKG#ReplicantFM1-}
          VER=${VER%.fwsc}
          echo "file=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publishing $PKG as $VER"

      - name: Build the site
        run: python3 web/make_site.py "${{ steps.pkg.outputs.file }}" "${{ steps.pkg.outputs.version }}" site

      - name: The installer must point at the package
        run: |
          test -f site/webapp/installer/index.html
          test -f site/webapp/editor/index.html
          grep -q "webapp/installer" site/index.html
          ls -l site/firmware/

      # enablement: a fresh repo has Pages off; the job's pages: write lets the action turn it on itself, so
      # publishing works from a clean clone without a click in Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
