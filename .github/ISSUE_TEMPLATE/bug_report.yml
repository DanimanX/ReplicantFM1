name: Bug report
description: Something in ReplicantFM1 doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a fork of [Felucca](https://github.com/hugelton/Felucca): bugs introduced here belong here, not in
        the upstream tracker. If the same thing happens on stock Felucca 1.8.1, report it upstream.
  - type: input
    id: version
    attributes:
      label: ReplicantFM1 version
      description: MENU > ABOUT on the FM-1 (or the .fwsc file name)
      placeholder: "v1.8.1-ht1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
